[package]
name = "niruamp"
version = "0.3.3"
edition = "2021"
rust-version = "1.85"
description = "A Winamp-inspired Rust frontend for NPLAY on the NIRUX desktop"
license = "MIT"
repository = "https://github.com/nirucon/niruamp"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
raw-window-handle = "0.6"
x11rb = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
