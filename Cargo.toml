[package]
name = "niruamp"
version = "0.7.1"
edition = "2021"
rust-version = "1.85"
description = "A Winamp-inspired frontend for NPLAY on the NIRUX desktop"
license = "MIT"
repository = "https://github.com/nirucon/niruamp"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
