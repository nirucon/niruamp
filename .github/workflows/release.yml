name: release

# A pushed tag vX.Y.Z builds the static x86_64 musl binary that install.sh
# downloads and publishes it with its SHA256SUMS file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build dependencies and X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools xvfb xdotool x11-utils python3 python3-mutagen
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked -- --test-threads=1
      - name: Build a static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify identity, static linking and the GUI
        run: |
          B=target/x86_64-unknown-linux-musl/release/niruamp
          $B --version | grep -qx "NIRUAMP $VERSION"
          if ldd $B 2>&1 | grep -q '=>'; then echo "::error::niruamp is dynamically linked"; exit 1; fi
          # NPLAY 2 is a single static binary; fetch the released one and check it.
          mkdir -p "$RUNNER_TEMP/nplay"
          base=https://github.com/nirucon/nplay/releases/download/v2.0.1
          curl -fsSL -o "$RUNNER_TEMP/nplay/nplay" "$base/nplay"
          curl -fsSL -o "$RUNNER_TEMP/nplay/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$RUNNER_TEMP/nplay" && grep ' nplay$' SHA256SUMS | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/nplay/nplay"
          ln -sf "$RUNNER_TEMP/nplay/nplay" "$RUNNER_TEMP/nplay-run"
          NIRUAMP_TEST_DISPLAY=99 sh tests/xvfb.sh $B "$RUNNER_TEMP/nplay-run"
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/niruamp dist/niruamp
          tar --owner=0 --group=0 --numeric-owner -C dist \
            -czf "dist/niruamp-$VERSION-x86_64-linux-musl.tar.gz" niruamp
          cd dist && sha256sum niruamp "niruamp-$VERSION-x86_64-linux-musl.tar.gz" > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v h="# NIRUAMP $VERSION" '$0==h{f=1;next} /^# NIRUAMP /{f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "NIRUAMP $VERSION" --notes "$notes" \
            dist/niruamp "dist/niruamp-$VERSION-x86_64-linux-musl.tar.gz" dist/SHA256SUMS
