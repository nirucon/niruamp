name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils python3 python3-mutagen
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: End-to-end GUI test against NPLAY
        run: |
          git clone --quiet --depth 1 --branch v1.8.2 https://github.com/nirucon/nplay "$RUNNER_TEMP/nplay"
          printf '#!/bin/sh\nPYTHONPATH=%s exec python3 -m nplay.app "$@"\n' "$RUNNER_TEMP/nplay" > "$RUNNER_TEMP/nplay-run"
          chmod +x "$RUNNER_TEMP/nplay-run"
          NIRUAMP_TEST_DISPLAY=99 sh tests/xvfb.sh target/release/niruamp "$RUNNER_TEMP/nplay-run"

  msrv:
    # Cargo.toml declares rust-version 1.85, which is also Debian 13's rustc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Tests on the declared rust-version
        run: cargo test --locked -- --test-threads=1
