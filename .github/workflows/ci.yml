name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils python3 python3-mutagen
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: End-to-end GUI test against NPLAY
        run: |
          # NPLAY 2 is a single static binary; fetch the released one and check it.
          mkdir -p "$RUNNER_TEMP/nplay"
          base=https://github.com/nirucon/nplay/releases/download/v2.0.1
          curl -fsSL -o "$RUNNER_TEMP/nplay/nplay" "$base/nplay"
          curl -fsSL -o "$RUNNER_TEMP/nplay/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$RUNNER_TEMP/nplay" && grep ' nplay$' SHA256SUMS | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/nplay/nplay"
          ln -sf "$RUNNER_TEMP/nplay/nplay" "$RUNNER_TEMP/nplay-run"
          NIRUAMP_TEST_DISPLAY=99 sh tests/xvfb.sh target/release/niruamp "$RUNNER_TEMP/nplay-run"

  msrv:
    # Cargo.toml declares rust-version 1.85, which is also Debian 13's rustc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Tests on the declared rust-version
        run: cargo test --locked -- --test-threads=1
